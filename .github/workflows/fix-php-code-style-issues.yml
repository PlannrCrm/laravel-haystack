name: Code Style

on:
  push:
    branches:
      - 'main'
      - 'laravel-13'
  pull_request:
    branches:
      - '*'

permissions:
  contents: write

jobs:
  php-cs-fixer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run PHP CS Fixer
        uses: docker://oskarstark/php-cs-fixer-ga@sha256:0cd5f664ba2d4fb0fd463061644e0edfdcfce1e9b4afe21c22be98f2ffd9d6ad # latest
        with:
          args: --config=.php-cs-fixer.dist.php --allow-risky=yes
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: 🪄 Code Style Fixes
